Identifier: eos3pu0
Slug: liquid-stock-similarity
Status: In progress
Title: Enamine Liquid Stock Similarity
Description: Retrieves the 100 nearest neighbours of a query molecule in the 
  Enamine Liquid Stock collection, a set of 2,492,445 screening compounds 
  indexed by Ersilia. Three learned embeddings are searched independently, 
  namely CLAMP for bioactivity, SAND for 3D shape and Mol-JEPA for predicted 
  biological context, and their rankings are fused into one list. Ersilia built 
  the search with LazySim, which indexes each embedding with turbovec 4-bit 
  quantization.
